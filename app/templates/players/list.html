{% extends "base.html" %}
{% block title %}Jugadores{% endblock %}
{% block content %}
<h1>Jugadores</h1>
<div class="grid two wide-left">
  <section class="card">
    <table>
      <thead><tr><th>Nombre</th><th>Usuario</th><th>País</th><th>Juegos</th><th></th></tr></thead>
      <tbody>
      {% for p in players %}
        <tr>
          <td><a href="{{ url_for('players.detail', username=p.username) }}">{{ p.name }}</a></td>
          <td class="muted">@{{ p.username }}</td>
          <td>{{ p.country or '' }}</td>
          <td>{{ p.games }}</td>
          <td><a class="link" href="{{ url_for('main.graph_view', username=p.username) }}">grafo</a></td>
        </tr>
      {% else %}
        <tr><td colspan="5" class="muted">No hay jugadores.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </section>

  <section class="card">
    <h2>Nuevo jugador</h2>
    <form method="post" class="form">
      <label>Usuario <input name="username" required pattern="[a-z0-9_]{3,20}" placeholder="ej. samuel_c"></label>
      <label>Nombre <input name="name" required placeholder="Nombre completo"></label>
      <label>País (2 letras) <input name="country" maxlength="2" placeholder="MX"></label>
      <button class="btn" type="submit">Crear jugador</button>
    </form>
  </section>
</div>
{% endblock %}
