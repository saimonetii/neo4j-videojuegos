{% extends "base.html" %}
{% block title %}Grafo de {{ username }}{% endblock %}
{% block head %}
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Vecindad de <a href="{{ url_for('players.detail', username=username) }}">@{{ username }}</a></h1>
  <div class="legend">
    <span class="lg me">Jugador</span><span class="lg player">Amigo</span>
    <span class="lg game">Juego</span><span class="lg genre">Género</span>
  </div>
</div>
<div id="network" class="card network"></div>
{% endblock %}
{% block scripts %}
<script>
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const palette = () => ({
    Me: css('--n-me'), Player: css('--n-player'), Game: css('--n-game'), Genre: css('--n-genre'),
  });
  let network;
  fetch("{{ url_for('main.graph_api', username=username) }}")
    .then(r => r.json())
    .then(data => {
      const colors = palette();
      const nodes = data.nodes.map(n => ({
        ...n, shape: n.group === 'Genre' ? 'box' : 'dot',
        size: n.group === 'Me' ? 28 : 16,
        color: colors[n.group], font: {color: css('--text')}
      }));
      const edges = data.edges.map(e => ({
        ...e, arrows: e.type === 'FRIEND_OF' ? '' : 'to',
        dashes: e.type === 'HAS_GENRE', font: {color: css('--muted'), strokeWidth: 0, size: 11},
        color: {color: e.type === 'FRIEND_OF' ? colors.Player : css('--line')}
      }));
      network = new vis.Network(document.getElementById('network'),
        {nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges)},
        {physics: {stabilization: true, barnesHut: {springLength: 120}}, interaction: {hover: true}});
    });
  document.addEventListener('themechange', () => location.reload());
</script>
{% endblock %}
